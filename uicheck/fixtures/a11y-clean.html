<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir Warung</title>
<style>
  body { font-family: Georgia, serif; color: #1a1a1a; background: #fff; margin: 0; }
  header { padding: 16px 24px; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  button { font: inherit; padding: 10px 16px; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #1a4fd6; outline-offset: 2px; }
</style>
</head>
<body>
<header><a href="#isi">Langsung ke isi</a></header>
<main id="isi">
  <h1>Transaksi baru</h1>
  <form>
    <label for="barang">Nama barang</label>
    <input id="barang" name="barang" autocomplete="off">
    <button type="submit">Tambah ke nota</button>
  </form>
</main>
</body>
</html>
