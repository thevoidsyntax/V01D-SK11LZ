<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Platform Terpadu</title>
<style>
  body { font-family: Inter, system-ui, sans-serif; color: #444; background: #fff; margin: 0; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: #777; }
  h1 { font-size: 52px; line-height: 1.2; background: linear-gradient(90deg, #7c3aed, #2563eb); color: transparent; }
  h2 { font-size: 30px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .pill { border-radius: 999px; backdrop-filter: blur(8px); padding: 8px 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .grid { display: flex; gap: 16px; }
  .card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card .card { border: 1px solid #eee; border-radius: 10px; padding: 12px; }
  .num { font-size: 13px; color: #999; }
  .late { margin-top: 520px; }
</style>
</head>
<body>
<main class="wrap">
  <section>
    <nav class="pill">Menu</nav>
    <p class="eyebrow">Platform Terpadu</p>
    <h1>Solusi enterpriseXR untuk workflow modern</h1>
    <p class="tag">Terbaru</p>
    <p class="mono">versi-2.1.0</p>
    <p>🚀 Semuanya dalam satu tempat.</p>
    <p class="num">01</p>
    <p class="num">02</p>
    <p class="num">03</p>
    <p>Jakarta · 2026 · Gratis</p>
    <a href="#harga">Lihat harga →</a>
  </section>
  <section>
    <div class="grid">
      <div class="card"><svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16"/></svg><p>Cepat</p></div>
      <div class="card"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/></svg><p>Mudah</p></div>
      <div class="card"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M0 0h16v16H0z"/></svg><p>Aman</p></div>
    </div>
    <div class="card"><p>Detail</p><div class="card"><p> furthermore</p></div></div>
  </section>
  <section class="late">
    <h2 style="font-size:26px">Harga</h2>
  </section>
  <section>
    <h2 style="font-size:22px">FAQ</h2>
  </section>
</main>
</body>
</html>
